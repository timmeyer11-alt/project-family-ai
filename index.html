<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Family.ai</title>
<meta name="description" content="Project Family.ai teaches everyday people how to use AI to make life better for themselves and their families.">
<meta name="theme-color" content="#FAFAF8">
<meta property="og:title" content="Project Family.ai">
<meta property="og:description" content="AI, thought about simply. For our communities.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
@font-face{font-family:"Inter";src:url("fonts/inter-var.woff2") format("woff2");font-weight:200 600;font-display:swap}
/* Brand tokens: 02 Marketing & Brand / 02 Brand System / pfai-brand-tokens.css */
:root{
  --pfai-forest:#1B4332; --pfai-coral:#FF6F61; --pfai-mid-green:#2D6A4F; --pfai-light-green:#40916C;
  --pfai-near-black:#0B0F0E; --pfai-off-white:#FAFAF8; --pfai-white:#FFFFFF;
  --pfai-font-sans:"Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--pfai-off-white)}
body{font-family:var(--pfai-font-sans);color:var(--pfai-near-black);background:var(--pfai-off-white);
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;line-height:1.6}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 28px 48px}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--pfai-forest);margin-bottom:40px}
.wordmark span{color:var(--pfai-coral)}
/* Official master mark, file unchanged. The wrapper only hides the file's transparent padding. */
.logo{position:relative;width:200px;aspect-ratio:612/495;overflow:hidden;margin-bottom:48px}
.logo img{position:absolute;width:250.98%;height:auto;left:-73.53%;top:-35.15%;display:block}
h1{font-weight:600;font-size:clamp(32px,5vw,60px);line-height:1.12;letter-spacing:-.025em;color:var(--pfai-forest);max-width:20ch}
h1 .l2{display:block;color:var(--pfai-mid-green)}
.lede{margin-top:24px;max-width:36ch;text-wrap:balance;font-size:clamp(17px,1.4vw,19px);font-weight:400;color:var(--pfai-near-black)}
.btn{display:inline-block;margin-top:40px;padding:15px 32px;border-radius:999px;background:var(--pfai-coral);color:var(--pfai-near-black);
  text-decoration:none;font-weight:600;font-size:16px;letter-spacing:.01em;transition:background .3s,color .3s}
.btn:hover,.btn:focus-visible{background:var(--pfai-forest);color:var(--pfai-white);outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px var(--pfai-off-white),0 0 0 5px var(--pfai-light-green)}
footer{padding:0 28px 36px;text-align:center;font-size:13px;color:var(--pfai-mid-green)}

/* restrained reveal */
.r{opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease}
.r.in{opacity:1;transform:none}
.d1{transition-delay:.3s}.d2{transition-delay:.8s}.d3{transition-delay:1.3s}
@media (prefers-reduced-motion:reduce){.r{opacity:1;transform:none;transition:none}}
@media (max-width:520px){
  main{padding:56px 24px 40px}
  .wordmark{margin-bottom:32px}
  .logo{width:160px;margin-bottom:40px}
}
</style>
</head>
<body>
<main>
  <div class="wordmark r">Project Family<span>.ai</span></div>
  <div class="logo r"><img src="brand/pfai-master-mark-peach-on-dark.png" alt="Project Family.ai logo: a human head in forest green and an AI head in coral with a circuit chip, back to back" width="1536" height="1024"></div>
  <h1 class="r d1">Something changed.<span class="l2">Few were shown how.</span></h1>
  <p class="lede r d2">AI, thought about simply. For our communities.</p>
  <a class="btn r d3" href="mailto:tim.meyer11@gmail.com?subject=Hello">Begin a conversation</a>
</main>
<footer>© 2026 Project Family.ai LLC · Minnesota</footer>
<script>
(function(){
  var els=document.querySelectorAll('.r');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
  },{threshold:.2});
  els.forEach(function(e){io.observe(e)});
})();
</script>
</body>
</html>
